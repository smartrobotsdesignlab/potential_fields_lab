pole_detector:
  ros__parameters:
    pole_radius: 0.05        # 10 cm thermocol cylinder
    max_range: 1.6           # >= 3 beams on the pole out to here
    min_width: 0.05
    max_width: 0.16
    bg_gap: 0.15             # pole must stand >= 15 cm in front of its background
    jump: 0.08
    alpha: 0.3               # smoothing of the tracked position
    confirm_hits: 3
    drop_after: 1.5
    beam_time_mode: "stamp"  # set after the spin test on the real LDS-01
    tf_wait: 0.25            # wait for the pose that matches the scan (Wi-Fi delay)
    # Test arena in odom (the robot's start pose): only poles inside are used
    roi_enable: true
    roi_xmin: 0.3
    roi_xmax: 1.6
    roi_ymin: -0.5
    roi_ymax: 0.5
